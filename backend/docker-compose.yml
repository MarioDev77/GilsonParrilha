# PostgreSQL local para desenvolvimento. Credenciais abaixo são só de DEV.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gilson
      POSTGRES_PASSWORD: gilson_dev_pass
      POSTGRES_DB: gilson_parrilha
    ports:
      - "5432:5432"
    volumes:
      - gilson_pgdata:/var/lib/postgresql/data
volumes:
  gilson_pgdata:
